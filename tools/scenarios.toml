[x86_64-neg-switch-in-dpc]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/wait.rs",
    "kernel/ke/thread.rs",
    "kernel/ke/dpc.rs",
    "lib/ke/",
]
cmdline = "test=neg.switch-in-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x000000B8 ATTEMPTED_SWITCH_FROM_DPC: a thread switch"

[aarch64-neg-switch-in-dpc]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.switch-in-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x000000B8 ATTEMPTED_SWITCH_FROM_DPC: a thread switch"

[x86_64-neg-mutex-held-at-exit]
arch = "x86_64"
tier = "gate"
paths = ["kernel/ke/mutex.rs", "kernel/ke/thread.rs", "kernel/ps/"]
