tier = "gate"
cmdline = "test=oracle.nkc-seh-fatal-work"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xE04E4B12 \\(parameter 1 0xffffffffe04e4b12\\)"

[aarch64-oracle-nkc-seh-fatal-work]
arch = "aarch64"
tier = "gate"
cmdline = "test=oracle.nkc-seh-fatal-work"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xE04E4B12 \\(parameter 1 0xffffffffe04e4b12\\)"

[x86_64-oracle-nkc-seh-fatal-dpc]
arch = "x86_64"
tier = "gate"
cmdline = "test=oracle.nkc-seh-fatal-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x0000001E KMODE_EXCEPTION_NOT_HANDLED: 0xE04E4B13 \\(parameter 1 0xffffffffe04e4b13\\)"

[aarch64-oracle-nkc-seh-fatal-dpc]
arch = "aarch64"
tier = "gate"
cmdline = "test=oracle.nkc-seh-fatal-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x0000001E KMODE_EXCEPTION_NOT_HANDLED: 0xE04E4B13 \\(parameter 1 0xffffffffe04e4b13\\)"

[x86_64-oracle-nkc-seh-fatal-kernel-read]
arch = "x86_64"
tier = "gate"
cmdline = "test=oracle.nkc-seh-fatal-kernel-read"
expect = "bugcheck"
match = "BUGCHECK: 0x00000050 PAGE_FAULT_IN_NONPAGED_AREA: 0x4E4B0000 \\(parameter 1 0xfffff7804e4b0000, parameter 2 0x0\\)"

[aarch64-oracle-nkc-seh-fatal-kernel-read]
arch = "aarch64"
tier = "gate"
