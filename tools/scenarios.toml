# Boot scenarios: one QEMU run each, judged by tools/judge.py.
#
#   arch      x86_64 | aarch64
#   tier      which runs include it: "gate" (the three gates, each a
#             selection of the tier, below) or "soak"
#   paths     list of files, and of directories ending in `/`, whose
#             change selects the scenario (x86-64, tier "gate"): the code
#             the scenario is there to prove. Each must exist
#   smp       guest CPUs (default: $QEMU_SMP, else 4). The harness adds
#             `cpus=<smp>` to the command line unless the scenario sets it,
#             and the kernel checks it found that many
#   cmdline   kernel command line (\NK\cmdline.txt); see kernel/test.rs
#   expect    "ok" (default), "bugcheck" or "fail"
#   match     expect = "bugcheck": regular expression the BUGCHECK line
#             must contain
#   then      expect = "bugcheck": regular expression a line printed after
#             the BUGCHECK line must contain (a bugcheck callback's)
#   must_fail expect = "fail": exactly these tests fail
#   accel     "tcg": emulate the processor even where the host could run
#             it directly (x86-64 only; arm64 is always emulated)
#   disk      "ahci": the machine has a data disk on an AHCI controller
#             (the one q35 has; one added to arm64's `virt`). It is a raw
#             file made for each boot, every sector holding a pattern the
#             kernel can compute (tools/datadisk.py, doc/TESTING.md)
#   disk_size the disk's size in MiB (default 64)
#   disk_image  with `disk`, a FAT32 volume in place of the pattern:
#             "fat32-mbr" or "fat32-gpt", one partition at 1 MiB holding
#             known files (tools/fatdisk.py)
#   disk_expect  with `disk`, what the disk must hold after the boot:
#             "unchanged": every sector its original pattern;
#             "written": the sectors of the write range the written
#             pattern, every other sector its original one;
#             with `disk_image`, "fat-unchanged": fsck.fat finds the
#             volume clean and its files as they were made
#   registry  list of names: fixtures/registry-<name>.txt is laid over the
#             hive too, after registry-overlay.txt
#   golden    directory in tools/golden/ listing every test and its verdict
#   canonical true: this run's log and export list are kept as
#             target/qemu/serial-<arch>.log and exports-<arch>.txt (the
#             ledger is generated from the latter)
#
# `make check` / `check-arm` run the scenario named after the architecture.
#
# What each gate boots of the tier "gate" (tools/boot_test.py, `select`):
#
#   make gate-fast  `x86_64`, and each x86-64 scenario with `paths` that
#                   name a file changed since the branch left `updates`.
#                   A scenario without `paths` is not in this gate
#   make gate       every x86-64 scenario with expect = "ok"; one that
#                   expects a bugcheck or a failure only when its `paths`
#                   name a file changed since this gate last passed, or
#                   when that is not known (CI): then all of x86-64
#   make gate-full  every scenario, both architectures

[x86_64]
arch = "x86_64"
tier = "gate"
golden = "x86_64"
canonical = true

[aarch64]
arch = "aarch64"
tier = "gate"
golden = "aarch64"
canonical = true

# One processor: nothing may depend on there being others.

[x86_64-smp1]
arch = "x86_64"
tier = "gate"
paths = ["kernel/ke/", "kernel/arch/x86_64/", "kernel/hal/", "lib/ke/"]
smp = 1
golden = "x86_64"

[aarch64-smp1]
arch = "aarch64"
tier = "gate"
smp = 1
golden = "aarch64"

# Kernel APCs on their own: the order of delivery, what holds it back,
# and a wait interrupted for them and resumed; once on one processor,
# where the busy thread is only ever ready, not running elsewhere.

[x86_64-ke-apc]
arch = "x86_64"
tier = "gate"
paths = ["kernel/ke/apc.rs", "kernel/ke/wait.rs", "kernel/ke/interrupt.rs", "lib/ke/apc.rs"]
cmdline = "test=ke.apc.*"

[x86_64-ke-apc-smp1]
arch = "x86_64"
tier = "gate"
paths = ["kernel/ke/apc.rs", "kernel/ke/wait.rs", "kernel/ke/interrupt.rs", "lib/ke/apc.rs"]
smp = 1
cmdline = "test=ke.apc.*"

[aarch64-ke-apc]
arch = "aarch64"
tier = "gate"
cmdline = "test=ke.apc.*"

# The mount path with nkfs's mount half: a file system registered on the
# disk queue mounted by a first open, its stream file object's cleanup
# and close, a create on a 0x6000 stack expansion, a raise across one,
# and a read split into associated requests; the mount path traced.

[x86_64-io-mount]
arch = "x86_64"
tier = "gate"
paths = ["kernel/io/", "lib/io/", "kernel/ke/expand.rs", "kernel/selftest/nkfs_mount.rs"]
cmdline = "test=io.mount.* trace=mount"

# A data disk on the machine changes nothing for a kernel that does not
# write it: the boot passes, and the disk is as it was made. This is the
# harness's own proof that the disk is attached, kept and compared.

[x86_64-disk-present]
arch = "x86_64"
tier = "gate"
paths = ["tools/"]
smp = 1
cmdline = "test=mm.frames"
disk = "ahci"
disk_expect = "unchanged"

# The soak tier (`make soak`): the whole test list again and again, with
# other numbers of processors and both ways of running x86-64, on a host
# given more to do than it can do at once.

[x86_64-soak-smp2]
arch = "x86_64"
tier = "soak"
smp = 2
golden = "x86_64"

[x86_64-soak-smp3]
arch = "x86_64"
tier = "soak"
smp = 3
golden = "x86_64"

[x86_64-soak-smp8]
arch = "x86_64"
tier = "soak"
smp = 8
golden = "x86_64"

[x86_64-soak-smp4]
arch = "x86_64"
tier = "soak"
golden = "x86_64"

[x86_64-soak-smp1]
arch = "x86_64"
tier = "soak"
smp = 1
golden = "x86_64"

[aarch64-soak-smp2]
arch = "aarch64"
tier = "soak"
smp = 2
golden = "aarch64"

[aarch64-soak-smp3]
arch = "aarch64"
tier = "soak"
smp = 3
golden = "aarch64"

[aarch64-soak-smp8]
arch = "aarch64"
tier = "soak"
smp = 8
golden = "aarch64"

[aarch64-soak-smp4]
arch = "aarch64"
tier = "soak"
golden = "aarch64"

[aarch64-soak-smp1]
arch = "aarch64"
tier = "soak"
smp = 1
golden = "aarch64"

[x86_64-soak-tcg]
arch = "x86_64"
tier = "soak"
accel = "tcg"
golden = "x86_64"

[x86_64-soak-tcg-smp8]
arch = "x86_64"
tier = "soak"
accel = "tcg"
smp = 8
golden = "x86_64"

# The harness must tell a kernel bug from a pass: a Rust panic and a stray
# memory access each have to end the boot with a bugcheck. A stray access
# to kernel memory is Windows' page-fault bugcheck; one to the user half
# is an access violation nothing handles.

[x86_64-neg-panic]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/kd/",
    "kernel/ke/bugcheck.rs",
    "lib/ke/bugcheck.rs",
    "kernel/selftest/neg.rs",
    "tools/",
]
cmdline = "test=neg.panic"
expect = "bugcheck"
match = "KERNEL PANIC: panicked at kernel/selftest/neg\\.rs"

[aarch64-neg-panic]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.panic"
expect = "bugcheck"
match = "KERNEL PANIC: panicked at kernel/selftest/neg\\.rs"

[x86_64-neg-fault]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/arch/x86_64/",
    "kernel/mm/",
    "kernel/ke/bugcheck.rs",
    "lib/ke/bugcheck.rs",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.fault"
expect = "bugcheck"
match = "BUGCHECK: 0x00000050 PAGE_FAULT_IN_NONPAGED_AREA"

[aarch64-neg-fault]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.fault"
expect = "bugcheck"
match = "BUGCHECK: 0x00000050 PAGE_FAULT_IN_NONPAGED_AREA"

# The memory manager's data sections, system-cache views and paging
# I/O, driven as the cache manager drives them over nkfs, the test-only
# file system: what each paging request looked like, and every page and
# block given back.

[x86_64-mm-section]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/mm/",
    "lib/mm/",
    "kernel/io/paging.rs",
    "kernel/io/irp.rs",
    "kernel/io/mdl.rs",
    "kernel/selftest/nkfs.rs",
    "kernel/selftest/nkfs_mm.rs",
]
cmdline = "test=mm.section trace=mm"
golden = "x86_64-mm-section"

# The cache manager over nkfs, called as a file system calls it: cache
# maps made and deleted, maps and pins, and what each reads and writes.

[x86_64-cc]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/cc/",
    "lib/cc/",
    "kernel/fsrtl/acquire.rs",
    "kernel/fsrtl/fastio.rs",
    "kernel/io/shutdown.rs",
    "kernel/selftest/nkfs.rs",
    "kernel/selftest/nkfs_cc.rs",
]
cmdline = "test=cc.* trace=cc"
golden = "x86_64-cc"

# Unmapping system address space a mapping does not hold stops the
# system as Windows does.

[x86_64-neg-unmap-io-space]
arch = "x86_64"
tier = "gate"
paths = ["kernel/mm/", "lib/mm/", "kernel/selftest/neg.rs"]
cmdline = "test=neg.unmap-io-space"
expect = "bugcheck"
match = "BUGCHECK: 0x000000DA SYSTEM_PTE_MISUSE"

# A fatal hardware error handed to the HAL (`HalBugCheckSystem`) stops
# the system with Windows' code for it, the error's source, its record
# and the machine check's status.

[x86_64-neg-hardware-error]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/whea/",
    "kernel/hal/",
    "lib/whea/",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.hardware-error"
expect = "bugcheck"
match = "BUGCHECK: 0x00000124 WHEA_UNCORRECTABLE_ERROR: KeBugCheckEx \\(parameter 1 0x0000000000000004, parameter 2 0x[0-9a-f]{16}, parameter 3 0x00000000deadbeef, parameter 4 0x0000000012345678\\)"

[aarch64-neg-hardware-error]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.hardware-error"
expect = "bugcheck"
match = "BUGCHECK: 0x00000124 WHEA_UNCORRECTABLE_ERROR: KeBugCheckEx \\(parameter 1 0x0000000000000004, parameter 2 0x[0-9a-f]{16}, parameter 3 0x00000000deadbeef, parameter 4 0x0000000012345678\\)"

# The low half of the address space is NK's own on both architectures:
# a null pointer faults, and so does ordinary memory at its physical
# address, which firmware's map of the low half made readable. One
# processor for the latter, so that it is the boot processor's low half
# that is tried: the one that was firmware's.

[x86_64-neg-low-memory]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/arch/x86_64/",
    "kernel/mm/",
    "kernel/ke/seh.rs",
    "kernel/selftest/neg.rs",
]
smp = 1
cmdline = "test=neg.low-memory"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xC0000005"

[aarch64-neg-low-memory]
arch = "aarch64"
tier = "gate"
smp = 1
cmdline = "test=neg.low-memory"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xC0000005"

[x86_64-neg-null]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/arch/x86_64/",
    "kernel/mm/",
    "kernel/ke/seh.rs",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.null"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xC0000005"

[aarch64-neg-null]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.null"
expect = "bugcheck"
match = "BUGCHECK: 0x0000007E SYSTEM_THREAD_EXCEPTION_NOT_HANDLED: 0xC0000005"

# Running off the kernel stack must be named as that.

[x86_64-neg-stack-overflow]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/arch/x86_64/",
    "kernel/mm/stack.rs",
    "kernel/ke/thread.rs",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.stack-overflow"
expect = "bugcheck"
match = "BUGCHECK: kernel stack overflow"

[aarch64-neg-stack-overflow]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.stack-overflow"
expect = "bugcheck"
match = "BUGCHECK: kernel stack overflow"

# So must running off a processor's DPC stack, in a DPC routine.

[x86_64-neg-dpc-stack-overflow]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/arch/x86_64/",
    "kernel/mm/stack.rs",
    "kernel/ke/dpc.rs",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.dpc-stack-overflow"
expect = "bugcheck"
match = "BUGCHECK: kernel stack overflow"

[aarch64-neg-dpc-stack-overflow]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.dpc-stack-overflow"
expect = "bugcheck"
match = "BUGCHECK: kernel stack overflow"

# Broken IRQL and locking rules must stop the system, with Windows'
# bugcheck code where Windows has one.

[x86_64-neg-lock-order]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/spinlock.rs",
    "kernel/ke/kspin.rs",
    "lib/ke/",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.lock-order"
expect = "bugcheck"
match = "BUGCHECK: lock order violation"

[x86_64-neg-lock-twice]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/spinlock.rs",
    "kernel/ke/kspin.rs",
    "lib/ke/",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.lock-twice"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000F SPIN_LOCK_ALREADY_OWNED"

[x86_64-neg-irql-lower]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/irql.rs",
    "kernel/arch/x86_64/",
    "kernel/selftest/neg.rs",
]
cmdline = "test=neg.irql-lower"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000A IRQL_NOT_LESS_OR_EQUAL"

[aarch64-neg-lock-order]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.lock-order"
expect = "bugcheck"
match = "BUGCHECK: lock order violation"

[aarch64-neg-lock-twice]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.lock-twice"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000F SPIN_LOCK_ALREADY_OWNED"

[aarch64-neg-irql-lower]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.irql-lower"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000A IRQL_NOT_LESS_OR_EQUAL"

# And a failing test must fail the run.

[x86_64-known-bad]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/test.rs",
    "lib/selftest/",
    "kernel/selftest/neg.rs",
    "tools/",
]
cmdline = "test=meta.fail"
expect = "fail"
must_fail = ["meta.fail"]

[aarch64-known-bad]
arch = "aarch64"
tier = "gate"
cmdline = "test=meta.fail"
expect = "fail"
must_fail = ["meta.fail"]

# A processor that goes missing must fail a test: tell the kernel the
# machine has three while QEMU gives it four.

[x86_64-wrong-cpus]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/hal/",
    "kernel/ke/smp.rs",
    "lib/hal/",
    "lib/ke/topology.rs",
    "tools/",
]
smp = 4
cmdline = "test=hal.cpus cpus=3"
expect = "fail"
must_fail = ["hal.cpus"]

[aarch64-wrong-cpus]
arch = "aarch64"
tier = "gate"
smp = 4
cmdline = "test=hal.cpus cpus=3"
expect = "fail"
must_fail = ["hal.cpus"]

[x86_64-neg-cpu-stuck]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/smp.rs",
    "kernel/ke/ipi.rs",
    "kernel/ke/time.rs",
    "kernel/arch/x86_64/",
]
cmdline = "test=neg.cpu-stuck"
expect = "bugcheck"
match = "BUGCHECK: processor 1 did not answer an interprocessor interrupt"

[aarch64-neg-cpu-stuck]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.cpu-stuck"
expect = "bugcheck"
match = "BUGCHECK: processor 1 did not answer an interprocessor interrupt"

[x86_64-neg-dpc-watchdog]
arch = "x86_64"
tier = "gate"
paths = ["kernel/ke/dpc.rs", "kernel/ke/time.rs"]
cmdline = "test=neg.dpc-watchdog dpc-limit=32"
expect = "bugcheck"
match = "BUGCHECK: 0x00000133 DPC_WATCHDOG_VIOLATION"

[aarch64-neg-dpc-watchdog]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.dpc-watchdog dpc-limit=32"
expect = "bugcheck"
match = "BUGCHECK: 0x00000133 DPC_WATCHDOG_VIOLATION"

[x86_64-neg-wait-at-dispatch]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/wait.rs",
    "kernel/ke/thread.rs",
    "kernel/ke/dpc.rs",
    "lib/ke/",
]
cmdline = "test=neg.wait-at-dispatch"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000A IRQL_NOT_LESS_OR_EQUAL: a wait that must block at IRQL 2"

[x86_64-neg-wait-in-dpc]
arch = "x86_64"
tier = "gate"
paths = [
    "kernel/ke/wait.rs",
    "kernel/ke/thread.rs",
    "kernel/ke/dpc.rs",
    "lib/ke/",
]
cmdline = "test=neg.wait-in-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x000000B8 ATTEMPTED_SWITCH_FROM_DPC: a DPC routine waited"

[aarch64-neg-wait-at-dispatch]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.wait-at-dispatch"
expect = "bugcheck"
match = "BUGCHECK: 0x0000000A IRQL_NOT_LESS_OR_EQUAL: a wait that must block at IRQL 2"

[aarch64-neg-wait-in-dpc]
arch = "aarch64"
tier = "gate"
cmdline = "test=neg.wait-in-dpc"
expect = "bugcheck"
match = "BUGCHECK: 0x000000B8 ATTEMPTED_SWITCH_FROM_DPC: a DPC routine waited"

# A DPC routine that lowers the IRQL can begin a wait; the thread switch
