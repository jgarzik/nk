[package]
name = "nkkrnl"
description = "The NK kernel"
version.workspace = true
build = "build.rs"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nkkrnl"
path = "main.rs"
test = false
bench = false

[dependencies]
nk-acpi = { path = "../lib/acpi" }
nk-bootinfo = { path = "../lib/bootinfo" }
nk-ex = { path = "../lib/ex" }
nk-hal = { path = "../lib/hal" }
nk-ke = { path = "../lib/ke" }
nk-mm = { path = "../lib/mm" }
nk-ntabi = { path = "../lib/ntabi" }
nk-ob = { path = "../lib/ob" }
nk-oracle = { path = "../lib/oracle" }
nk-pe = { path = "../lib/pe" }
nk-rtl = { path = "../lib/rtl" }
nk-cm = { path = "../lib/cm" }
nk-se = { path = "../lib/se" }
nk-unwind = { path = "../lib/unwind" }
nk-selftest = { path = "../lib/selftest" }

[lints]
workspace = true
