name: CI

# Runs the hosted subset of the commit gate: format, lint, host unit tests,
# and the main QEMU boot of each architecture with real driver fixtures.
# The full gate (`make gate`, every boot scenario) needs KVM and is run
# locally before each commit. See doc/TESTING.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Hosted runners have no usable KVM, so both architectures are
      # emulated; give the boots more room than the local default.
      BOOT_TEST_TIMEOUT: 600
      # A fixture that cannot be downloaded fails the run instead of
      # turning its tests into skips.
      NK_REQUIRE_FIXTURES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 mtools

      # Installs the toolchain, components and targets from rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Fetches the driver fixtures by URL and SHA-256 as part of the run.
      - name: Gate
        run: make ci

      - name: Upload serial and gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs
          path: |
            target/qemu/*.log
            target/qemu/*/
            target/gate/*.out
