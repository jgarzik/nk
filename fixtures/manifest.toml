# The files the tests are held to: Windows driver binaries, the registry
# hive NK boots from, and what the host tests compare layouts with (the
# tables Microsoft's compiler recorded, the kernel's symbol file).
#
# None of these files are in the repository. `tools/fetch_fixtures.py`
# downloads each one into target/fixtures/ and rejects any file whose
# SHA-256 differs. A fixture's identity is its hash: never patch one, and
# give a rebuilt binary a new entry.
#
# status:
#   microsoft-inbox  shipped by Microsoft in Windows; served by Microsoft's
#                    public symbol server
#   wdk-built        Microsoft sample source, unmodified, built with the WDK
#                    by github.com/jgarzik/nk-fixtures
#   nk-authored      NK's own test driver source, built with the WDK by
#                    github.com/jgarzik/nk-fixtures
#   windows-written  content of NK's choosing, written by Windows itself
#                    (the hive, saved by Windows' registry)
# kind (absent for a driver): `abi-table`, `pdb` or `hive`. Only drivers
#   and the hive go into a boot image, and only drivers are in the ledger.
#   With the hive goes registry-overlay.txt, the file next to this one:
#   keys and values the hive does not have yet.
# boot = false: a driver that is fetched but left out of the boot image.
# name, file: `file` is what the fixture is called in target/fixtures/,
#   where one directory holds every architecture's files. In a boot image
#   a driver is `<name>` with the extension of `file`: `null.x64.sys` is
#   \NK\drivers\null.sys, a `pshed.x64.dll` would be pshed.dll. That is the
#   name the kernel, the hive and other images' import tables know it by
#   (tools/mkesp.py `boot_name`; the ledger uses the same).
# The drivers that oracle/ has a script for are also run on real Windows,
# and NK must reproduce what they did there; see oracle/README.md.

